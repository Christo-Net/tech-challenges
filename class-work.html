<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<style>
   
    section{
        margin: 0;
        padding: 10% 0;
        background-color: black;
        height: fit-content;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }
  
    .row {
        width: fit-content;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .row>div:nth-child(1){
        border: 3px solid black;
        height: 300px;
        width: 270px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: green;
    }
    .row>div:nth-child(2){
        border: 3px solid black;
        height: 300px;
        width: 270px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: red;
    }
    .row>div:nth-child(3){
        border: 3px solid black;
        height: 300px;
        width: 270px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
    }
    .row>div:nth-child(4){
        border: 3px solid black;
        height: 300px;
        width: 270px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: blue;

    }
    h1{
        display: flex;
        align-items: center;
    }
    h1:before{
        content: "";
        display: block;
        background-color: white;
        height: 2px;
        width: 100px;
    }

    .neon-edge{
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .neon-edge::before{
        content: '';
        position: absolute;
        width: 150px;
        height: 150%;
        background: linear-gradient(#ff00c8,#6aff00);
        animation: neon 3s linear infinite;

    }
  @keyframes neon{
    from{
        transform: rotate(0deg);
    }
    to{
        transform: rotate(360deg);
    }
  }
  .neon-edge::after{
        content: '';
        position: absolute;
        /* inset: 1px; */
        background-color: white;
        width: 20%;
        height: 50%;
        /* border: 100px; */
    }


    .slide-button {
    position: relative;
    overflow: hidden;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    color: white;
    background-color: #007bff;
    transition: all 0.4s ease-in-out;
}

.slide-button::before {
    content: "Hovered!";
    position: absolute;
    top: 0;
    left: 100%;
    width: 100%;
    height: 100%;
    background-color: #28a745;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    transition: all 0.4s ease-in-out;
}

.slide-button:hover {
    color: transparent;

}

.slide-button:hover::before {
    left: 0;

}
 .wig{
    width: 100px;
    height: 100px;
    columns: pink;
    background-color: #007bff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: rotateY(50deg) rotateX(160deg);
}
</style>
<body>
    <section>
        <div class="container">
            <div class="row d-flex justify-content-center align-items-center">
                <div class="col-lg col-sm-5 col-xs-10">green</div>
                <div class="col-lg col-sm-5 col-xs-10">red</div>
                <div class="col-lg col-sm-5 col-xs-10">white</div>
                <div class="col-lg col-sm-5 col-xs-10">blue</div>
            </div>
        </div>
    </section>

    <section>
        <h1 class="text-light">mkldm</h1>
    </section>

    <section class="neon-edge">
        <h1></h1>
    </section>


    <section class="button">
        <button class="slide-button">DASHBOARD</button>
    </section>


    <section class="wig">
        <div class="wiggle">wiggle</div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
